[package]
name = "tauri-plugin-thumbar"
version = "0.1.0"
description = "Runtime-defined Windows taskbar thumbnail toolbar controls for Tauri apps"
authors = ["Miaoyww"]
license = "MIT"
edition = "2021"
repository = "https://github.com/Miaoyww/tauri-plugin-thumbar"
rust-version = "1.77.2"
links = "tauri-plugin-thumbar"

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "Taskbar thumbnail toolbar APIs are fully supported." }
linux = { level = "partial", notes = "Plugin commands are available but taskbar thumbnail controls are no-op." }
macos = { level = "partial", notes = "Plugin commands are available but taskbar thumbnail controls are no-op." }
android = { level = "partial", notes = "Plugin commands are available but taskbar thumbnail controls are no-op." }
ios = { level = "partial", notes = "Plugin commands are available but taskbar thumbnail controls are no-op." }

[lib]
name = "tauri_plugin_thumbar"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
base64 = "0.22"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# 0.25.6 is the last release that keeps the crate's Rust 1.77.2 minimum.
image = { version = "=0.25.6", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }