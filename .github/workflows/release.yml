name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml and package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tag must match v<major>.<minor>.<patch>, got '$tag'"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          crate_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          npm_version="$(node -p "require('./package.json').version")"

          if [[ "$crate_version" != "$version" ]]; then
            echo "::error::Cargo.toml version ($crate_version) does not match tag ($version)"
            exit 1
          fi
          if [[ "$npm_version" != "$version" ]]; then
            echo "::error::package.json version ($npm_version) does not match tag ($version)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build guest bindings
        run: pnpm build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "tauri-plugin-thumbar@$VERSION" version >/dev/null 2>&1; then
            echo "tauri-plugin-thumbar@$VERSION is already published; skipping."
          else
            npm publish --access public
          fi

  publish-crates:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if curl -fsS -o /dev/null \
            -H "User-Agent: tauri-plugin-thumbar-release-workflow" \
            "https://crates.io/api/v1/crates/tauri-plugin-thumbar/$VERSION"; then
            echo "tauri-plugin-thumbar $VERSION is already published; skipping."
          else
            cargo publish --token "$CARGO_REGISTRY_TOKEN"
          fi